<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mesos Watch Alerts</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="title"><img src="icons/32.png" alt="" width="18" height="18"> Mesos Watch Alerts</div>
    <div class="status"><span id="dot" class="dot"></span><span id="status">…</span>
      <button id="refresh" class="icon" title="Check now">↻</button>
      <button id="pause" class="icon" title="Pause all alerts"></button>
      <button id="settings" class="icon" title="Set up alerts (opens in a tab)">⚙</button></div>
  </header>

  <div id="banner" class="banner" hidden>
    <span id="bannerText"></span>
    <button id="openSite">Open mesos.watch</button>
  </div>

  <div class="bar">
    <span id="count">New alerts</span>
    <button id="clearAll" class="ghost" hidden>Clear all</button>
  </div>

  <ul id="alerts" class="alerts"></ul>

  <div id="empty" class="empty" hidden>
    <p id="emptyText"></p>
    <button id="setup">Set up alerts</button>
  </div>

<script src="util.js"></script>
<script src="ui.js"></script>
<script src="popup.js"></script>
</body>
</html>
